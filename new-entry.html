<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Entry | The Digital Vellum</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/e5f6f5a61c.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <a href="index.html" id="logo">The Digital Vellum</a>
        <div class="newentry-profile-div">
            <a href="vault.html"><button class="vault-btn">Vault</button></a>
            <a href="new-entry.html"><button class="new-entry-btn">New Entry</button></a>
            <a href="profile.html"><i class="fa-solid fa-circle-user"></i></a>
        </div>
    </header>

    <div class="entry-layout">
        <div class="entry-sidebar">
            <p id="side-title">DEPTH INSIGHT</p>
            <p id="side-content">Write without judgement. The vellum remembers only what you choose to ink.</p>
        </div>
        <form class="main-container2">
            <div id="date-title">
                <p id="date-stamp"> WEDNESDAY, 19th MAY 2026</p>
                <input type="text" id="entry-title" placeholder="Untitled Reflection...">
            </div>
            <div class="pill-tag">
                <span class="pill">#reflection</span>
                <span class="pill">Add tag +</span>
            </div>

            <textarea id="entry-content" placeholder="Begin your reflection..."></textarea>

            <div class="btm-action-bar">
                <div class="left-btm-action-bar">
                    <button class="btm-left" type="button"><i id="insert-icon" class="fa-solid fa-image"></i>Insert Memory</button>
                    <button class="btm-left" type="button" id="private-button"><i id="lock-icon" class="fa-solid fa-lock-open"></i>Private</button>
                </div>
                <div class="right-btm-action-bar">
                    <button id="discard-btn" type="button">Discard</button>
                    <button id="save-entry" type="button">Save Entry</button>
                </div>
            </div>
        </form>
    </div>

    <div class="toast">
        <p>Entry saved successfully!</p>
    </div>

    <footer>
        <p>&copy; 2026 The Digital Vellum. All rights reserved. Designed for reflection.</p>
        <nav>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Archive</a>
        </nav>
    </footer>

    <script src="new-entry.js"></script>
</body>

</html>
